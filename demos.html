  <section class="block"><div class="wrap">
    <h2>HVDC RTDS models</h2>
    <p class="lede-body">Real-time demos of the open RSCAD/RTDS library. <a href="portfolio/hvdc-rtds-models.html">HVDC RTDS models</a> · <a href="https://github.com/control-protection-grids-tudelft/HVDC-RTDS-models" target="_blank" rel="noopener">GitHub ↗</a></p>
    <div class="media-grid">
      <figure class="media-item">
        <video controls preload="metadata" playsinline width="420" height="236">

      <figure class="media-item">
        <video controls preload="metadata" playsinline width="420" height="236">
